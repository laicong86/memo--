name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发布资产是本机已通过全部回归测试并用 PyInstaller 构建的 exe，
      # 保存在 release/ 目录；云端只负责建 Release 与上传，不再重复构建。
      - name: Verify asset
        run: test -s release/MemoTool.exe

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "MemoTool ${GITHUB_REF_NAME}" \
              --notes-file release/NOTES.md
            gh release upload "${GITHUB_REF_NAME}" release/MemoTool.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/MemoTool.exe \
              --title "MemoTool ${GITHUB_REF_NAME}" \
              --notes-file release/NOTES.md \
              --verify-tag
          fi
